<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de datos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <section class="formulario-container">

            <div class="encabezado">
                <h1>Registro de datos</h1>
                <p>Completa la siguiente información</p>
            </div>

            <form id="formulario">

                <!-- NOMBRE - APELLIDO - TIPO DE DOCUMENTO -->
                <div class="form-row primera-fila">

                    <div class="form-group">
                        <label for="nombre">Nombre</label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ingresa tu nombre"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="apellido">Apellido</label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Ingresa tu apellido"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="tipoDocumento">
                            Tipo de documento
                        </label>

                        <select
                            id="tipoDocumento"
                            name="tipoDocumento"
                            required
                        >
                            <option value="">Seleccionar</option>
                            <option value="DNI">DNI</option>
                            <option value="CC">Cédula de ciudadanía</option>
                            <option value="CE">Cédula de extranjería</option>
                            <option value="TI">Tarjeta de identidad</option>
                            <option value="PASAPORTE">Pasaporte</option>
                        </select>
                    </div>

                </div>


                <!-- DNI - FECHA DE NACIMIENTO -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="dni">DNI</label>

                        <input
                            type="text"
                            id="dni"
                            name="dni"
                            placeholder="Número de documento"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="fechaNacimiento">
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            id="fechaNacimiento"
                            name="fechaNacimiento"
                            required
                        >

                    </div>

                </div>


                <!-- TELEFONO - EMAIL -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="telefono">
                            Número de teléfono
                        </label>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="Ej: 3001234567"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required
                        >

                    </div>

                </div>


                <!-- PAIS - CIUDAD -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="pais">
                            País de domicilio
                        </label>

                        <input
                            type="text"
                            id="pais"
                            name="pais"
                            placeholder="Ingresa tu país"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="ciudad">
                            Ciudad de domicilio
                        </label>

                        <input
                            type="text"
                            id="ciudad"
                            name="ciudad"
                            placeholder="Ingresa tu ciudad"
                            required
                        >

                    </div>

                </div>


                <!-- TRATAMIENTO DE DATOS -->
                <div class="check-container">

                    <input
                        type="checkbox"
                        id="tratamientoDatos"
                        name="tratamientoDatos"
                        required
                    >

                    <label for="tratamientoDatos">

                        Acepto el tratamiento de mis
                        datos personales de acuerdo
                        con la política de privacidad.

                    </label>

                </div>


                <!-- BOTÓN -->
               <div class="boton-container">

    <button type="submit" class="btn-enviar">
        Enviar datos
    </button>

</div>

            </form>

        </section>

    </main>

</body>

</html>
